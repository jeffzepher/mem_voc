<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>单词选择题练习</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="app">
        <div class="answer-toast" id="answerToast" role="status" aria-live="polite"></div>
        <!-- 顶部 -->
		<div class="header">
            <div class="header-title-row">
                <h1>📘 单词选择题</h1>
                <div class="header-summary">
                    <span class="word-count" id="wordCountLabel">共 <span id="wordCountNum">0</span> 词</span>
                    <div class="stats">
					<span>📝 已做 <span id="doneCount">0</span></span>
					<span class="correct">✅ <span id="correctCount">0</span></span>
					<span class="wrong">❌ <span id="wrongCount">0</span></span>
				</div>
                </div>
            </div>
			<div class="header-actions">
				<select class="word-type-select" id="wordTypeSelect" aria-label="选择词性">
					<option value="verb">动词</option>
					<option value="noun">名词</option>
                    <option value="adjective">形容词</option>
                    <option value="adverb">副词</option>
                    <option value="preposition">介词</option>
                    <option value="conjunction">连词</option>
				</select>

				<div class="quick-actions">
                    <button class="grid-toggle" id="gridToggle">📊 展开网格</button>
                    <button class="error-book-btn" id="errorBookBtn">
                        📕 错题本 <span class="count" id="errorCount">0</span>
                    </button>
                    <button class="error-book-btn permanent-book-btn" id="permanentBookBtn" type="button" aria-pressed="false">
                        📚 永久错题 <span class="count">0</span>
                    </button>
                    <button class="btn-reset" id="resetBtn">↻ 重置</button>
                    <button class="btn-reset" id="soundToggle" type="button" aria-pressed="false">🔇 声音关</button>
                </div>
			</div>
		</div>

        <div class="storage-notice" id="storageNotice" role="status" hidden></div>
        <div class="permanent-review-bar" id="permanentReviewBar" hidden>
            <span id="permanentReviewInfo"></span>
            <button class="btn-reset" id="repeatPermanentBtn" type="button">↻ 再练一轮</button>
        </div>
        <div class="data-backup-actions">
            <button class="btn-reset" id="chooseVocabularyBtn" type="button" aria-expanded="false" aria-controls="vocabularyPicker">选择词库 ▾</button>
            <button class="btn-reset" id="exportBackupBtn" type="button">导出备份</button>
            <button class="btn-reset" id="importBackupBtn" type="button">恢复备份</button>
            <input type="file" id="backupFileInput" accept=".json,application/json" hidden>
        </div>
        <div class="vocabulary-picker" id="vocabularyPicker" hidden>
            <label for="datasetSelect">选择词库，自动加载对应的进度和错题</label>
            <small id="vocabularyCurrentStatus" aria-live="polite"></small>
            <div class="vocabulary-picker-row">
                <select class="word-type-select" id="datasetSelect" aria-label="选择词库"></select>
                <button class="btn-reset" id="chooseLocalVocabularyBtn" type="button">从本地文件添加</button>
            </div>
            <small id="vocabularyPickerHint">每次练习一套词库，记录按词库独立保存。</small>
        </div>
        <div class="vocabulary-loader" id="vocabularyLoader" role="status" hidden>
            <span id="vocabularyLoadMessage"></span>
            <button class="btn-reset" id="retryVocabularyBtn" type="button">重试加载</button>
            <a href="data/toefl-common.json" download>下载默认词库</a>
        </div>
        <input type="file" id="vocabularyFileInput" accept=".json,application/json" hidden>
        <!-- 进度标签 -->
        <div class="progress-tabs" id="progressTabs"></div>

        <!-- 进度网格 -->
        <div class="grid-container" id="gridContainer">
            <div class="grid-items" id="gridItems"></div>
        </div>

        <!-- 题目 -->
        <div class="question-area">
            <div class="question-heading">
                <div class="q-header">
                    <div class="question-meta">
                        <span class="q-number" id="qNumber">第 1 题</span>
                        <span class="error-history" id="errorHistory" aria-live="polite" hidden></span>
                    </div>
                    <span class="q-status" id="qStatus">未作答</span>
                </div>
                <div class="word-row">
                    <div class="word-display" id="wordDisplay">正在加载词库…</div>
                    <button class="speaker-btn" id="speakWordBtn" type="button" aria-label="朗读当前单词" title="朗读单词">🔊</button>
                </div>
            </div>
            <div class="example-sentence" id="exampleSentence"></div>
            <div class="question-countdown" id="questionCountdown" hidden>
                <progress class="countdown-progress" id="questionTimeProgress" max="8" value="8" aria-label="本题剩余秒数"></progress>
                <span class="countdown-label" id="countdownLabel">8 秒</span>
            </div>
            <div class="options" id="optionsContainer"></div>
        </div>

        <!-- 底部导航 -->
        <div class="nav-footer">
            <div class="nav-buttons">
                <button class="nav-btn" id="prevBtn">‹ 上一题</button>
                <button class="nav-btn primary" id="nextBtn">下一题 ›</button>
            </div>
            <span class="progress-text" id="progressText"></span>
        </div>


    </div>

    <script src="app.js?v=20261024-load-status" defer></script>

</body>
</html>
