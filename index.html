<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>单词选择题练习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.10);
            padding: 32px 36px 28px;
            transition: all 0.2s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 6px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1a2634;
            letter-spacing: 0.3px;
        }
        .header h1 small {
            font-size: 15px;
            font-weight: 400;
            color: #6b7a8a;
            margin-left: 10px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .stats {
            display: flex;
            gap: 18px;
            font-size: 14px;
            color: #2c3e50;
            background: #f7f9fc;
            padding: 6px 18px 6px 20px;
            border-radius: 40px;
            line-height: 32px;
        }
        .stats span {
            font-weight: 600;
        }
        .stats .correct {
            color: #1e8e3e;
        }
        .stats .wrong {
            color: #d32f2f;
        }

        .btn-reset {
            background: none;
            border: 1px solid #d0d7de;
            border-radius: 30px;
            padding: 6px 18px;
            font-size: 13px;
            color: #2c3e50;
            cursor: pointer;
            transition: 0.2s;
            background: #fff;
        }
        .btn-reset:hover {
            background: #f0f2f5;
            border-color: #b0b8c0;
        }

        .progress-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 6px;
            margin: 18px 0 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid #e9edf2;
        }
        .progress-tabs .tab {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: #2c3e50;
            background: #f1f4f8;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            user-select: none;
        }
        .progress-tabs .tab:hover {
            background: #e4e9f0;
        }
        .progress-tabs .tab.active {
            background: #1a2634;
            color: #fff;
            border-color: #1a2634;
        }
        .progress-tabs .tab .badge {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            padding: 0 8px;
            margin-left: 4px;
            font-size: 12px;
        }
        .progress-tabs .tab.active .badge {
            background: rgba(255, 255, 255, 0.2);
        }

        .error-book-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }
        .error-book-btn {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 30px;
            padding: 4px 18px 4px 16px;
            font-size: 14px;
            color: #b91c1c;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .error-book-btn:hover {
            background: #fee2e2;
        }
        .error-book-btn .count {
            background: #b91c1c;
            color: #fff;
            border-radius: 30px;
            padding: 0 8px;
            font-size: 12px;
            line-height: 20px;
        }

        .question-area {
            background: #fafcff;
            border-radius: 20px;
            padding: 24px 28px 20px;
            border: 1px solid #e9edf2;
            margin-bottom: 16px;
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin-bottom: 14px;
        }
        .q-number {
            font-size: 15px;
            font-weight: 600;
            color: #1a2634;
        }
        .q-number .total {
            font-weight: 400;
            color: #6b7a8a;
        }
        .q-status {
            font-size: 13px;
            color: #6b7a8a;
            background: #f1f4f8;
            padding: 2px 16px;
            border-radius: 30px;
            line-height: 26px;
        }
        .q-status.answered {
            background: #e6f7e6;
            color: #1e7e34;
        }
        .q-status.wrong-status {
            background: #fde8e8;
            color: #b91c1c;
        }

        .word-display {
            font-size: 32px;
            font-weight: 700;
            color: #0b1a2a;
            letter-spacing: 0.5px;
            padding: 12px 0 6px;
            text-align: center;
            border-bottom: 2px dashed #e9edf2;
            margin-bottom: 20px;
            min-height: 70px;
        }
        .word-display.empty {
            color: #6b7a8a;
            font-size: 20px;
            font-weight: 400;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .option-item {
            background: #fff;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 16px;
            color: #1a2634;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }
        .option-item:hover:not(.disabled) {
            background: #f4f9ff;
            border-color: #b0c8e0;
        }
        .option-item .label {
            display: inline-block;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #f1f4f8;
            text-align: center;
            line-height: 26px;
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
            flex-shrink: 0;
        }
        .option-item .text {
            flex: 1;
        }

        .option-item.correct {
            border-color: #1e8e3e;
            background: #e9f7ed;
        }
        .option-item.correct .label {
            background: #1e8e3e;
            color: #fff;
        }
        .option-item.wrong {
            border-color: #d32f2f;
            background: #fde8e8;
        }
        .option-item.wrong .label {
            background: #d32f2f;
            color: #fff;
        }
        .option-item.disabled {
            cursor: default;
            opacity: 0.85;
        }
        .option-item.reveal-correct {
            border-color: #1e8e3e;
            background: #e9f7ed;
        }
        .option-item.reveal-correct .label {
            background: #1e8e3e;
            color: #fff;
        }

        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 6px;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        .nav-btn {
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid #d0d7de;
            background: #fff;
            color: #2c3e50;
            cursor: pointer;
            transition: 0.15s;
        }
        .nav-btn:hover:not(:disabled) {
            background: #f1f4f8;
            border-color: #b0b8c0;
        }
        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .nav-btn.primary {
            background: #1a2634;
            border-color: #1a2634;
            color: #fff;
        }
        .nav-btn.primary:hover:not(:disabled) {
            background: #2c3e50;
            border-color: #2c3e50;
        }

        .progress-text {
            font-size: 14px;
            color: #6b7a8a;
        }

        .grid-toggle {
            background: none;
            border: none;
            color: #2c3e50;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline dotted;
            padding: 4px 0;
        }
        .grid-toggle:hover {
            color: #0b1a2a;
        }

        .grid-container {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e9edf2;
        }
        .grid-container.open {
            display: block;
        }
        .grid-items {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
            padding: 4px 0;
        }
        .grid-item {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: #e9edf2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            color: #2c3e50;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid transparent;
        }
        .grid-item:hover {
            border-color: #1a2634;
        }
        .grid-item.correct {
            background: #1e8e3e;
            color: #fff;
        }
        .grid-item.wrong {
            background: #d32f2f;
            color: #fff;
        }
        .grid-item.current {
            border-color: #1a2634;
            border-width: 2px;
            box-shadow: 0 0 0 2px rgba(26, 38, 52, 0.15);
        }

        .answer-toast {
            position: fixed;
            left: 50%;
            top: 22px;
            transform: translate(-50%, -12px);
            padding: 10px 18px;
            border-radius: 999px;
            background: #1e8e3e;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0,0,0,.16);
            opacity: 0;
            pointer-events: none;
            transition: opacity .18s ease, transform .18s ease;
            z-index: 9999;
        }
        .answer-toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
        .answer-toast.wrong-toast { background: #d32f2f; }

        @media (min-width: 641px) and (max-width: 1180px) {
            .container { max-width: 900px; width: calc(100% - 32px); }
            .options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (min-width: 1181px) {
            .container { max-width: 1040px; }
            .options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 640px) {
            .container {
                padding: 18px 16px 20px;
                border-radius: 20px;
            }
            .header h1 {
                font-size: 19px;
            }
            .header h1 small {
                font-size: 13px;
                margin-left: 4px;
                display: block;
            }
            .stats {
                font-size: 12px;
                padding: 4px 12px 4px 14px;
                gap: 10px;
                line-height: 28px;
            }
            .options {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .option-item {
                padding: 12px 14px;
                font-size: 15px;
            }
            .word-display {
                font-size: 26px;
                min-height: 56px;
            }
            .question-area {
                padding: 18px 16px 16px;
            }
            .nav-btn {
                padding: 8px 18px;
                font-size: 14px;
            }
            .progress-tabs .tab {
                font-size: 12px;
                padding: 3px 10px;
            }
            .grid-item {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }
        }

        @media (max-width: 420px) {
            .container {
                padding: 12px 10px 16px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-actions {
                justify-content: space-between;
            }
            .stats {
                font-size: 11px;
                padding: 2px 10px;
                gap: 8px;
                line-height: 26px;
            }
            .word-display {
                font-size: 22px;
                min-height: 48px;
            }
            .option-item {
                font-size: 14px;
                padding: 10px 12px;
            }
            .nav-footer {
                flex-direction: column;
                align-items: stretch;
            }
            .nav-buttons {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div class="answer-toast" id="answerToast" role="status" aria-live="polite"></div>
        <!-- 顶部 -->
		<div class="header">
			<h1>
				📘 单词选择题
				<small id="wordCountLabel">共 <span id="wordCountNum">631</span> 词</small>
			</h1>
			<div class="header-actions">
				<div class="stats">
					<span>📝 已做 <span id="doneCount">0</span></span>
					<span class="correct">✅ <span id="correctCount">0</span></span>
					<span class="wrong">❌ <span id="wrongCount">0</span></span>
				</div>
				<button class="btn-reset" id="resetBtn">↻ 重置</button>
			</div>
		</div>

        <!-- 进度标签 -->
        <div class="progress-tabs" id="progressTabs"></div>

        <!-- 错题本 -->
        <div class="error-book-bar">
            <button class="error-book-btn" id="errorBookBtn">
                📕 错题本 <span class="count" id="errorCount">0</span>
            </button>
            <button class="grid-toggle" id="gridToggle">📊 展开网格</button>
        </div>

        <!-- 题目 -->
        <div class="question-area">
            <div class="q-header">
                <span class="q-number" id="qNumber">第 1 题 <span class="total">/ <span id="totalQ">0</span></span></span>
                <span class="q-status" id="qStatus">未作答</span>
            </div>
            <div class="word-display" id="wordDisplay">loading...</div>
            <div class="options" id="optionsContainer"></div>
        </div>

        <!-- 底部导航 -->
        <div class="nav-footer">
            <div class="nav-buttons">
                <button class="nav-btn" id="prevBtn">‹ 上一题</button>
                <button class="nav-btn primary" id="nextBtn">下一题 ›</button>
            </div>
            <span class="progress-text" id="progressText">0 / 0</span>
        </div>

        <!-- 进度网格 -->
        <div class="grid-container" id="gridContainer">
            <div class="grid-items" id="gridItems"></div>
        </div>
    </div>

        // ================================================================
        //  核心状态
        // ================================================================
        const state = {
            words: [],
            questions: [],
            currentIndex: 0,
            errorWords: [],
            isReviewMode: false,
            dataLoaded: false,
        };

        // ================================================================
        //  工具函数
        // ================================================================
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 更难的干扰项：优先选择中文长度接近、共享字符、英文前缀/后缀相似的词，
        // 避免出现一眼就能排除的“完全不搭边”选项。
        function distractorScore(correctWord, candidateWord) {
            const a = correctWord.cn || '';
            const b = candidateWord.cn || '';
            const ac = [...a].filter(ch => /[\u4e00-\u9fff]/.test(ch));
            const bc = [...b].filter(ch => /[\u4e00-\u9fff]/.test(ch));
            const shared = new Set(ac.filter(ch => bc.includes(ch))).size;
            const lenDiff = Math.abs(ac.length - bc.length);

            const enA = correctWord.en.toLowerCase();
            const enB = candidateWord.en.toLowerCase();
            let prefix = 0;
            while (prefix < Math.min(enA.length, enB.length) && enA[prefix] === enB[prefix]) prefix++;
            const suffix = enA.slice(-2) === enB.slice(-2) ? 1 : 0;
            const sameShape = (/[；;，,]/.test(a) === /[；;，,]/.test(b)) ? 1 : 0;

            return shared * 5 + Math.max(0, 3 - lenDiff) * 2 + Math.min(prefix, 3) + suffix + sameShape;
        }

        function getDistractors(correctWord, allWords, count = 3) {
            const candidates = allWords
                .filter(w => w.en !== correctWord.en && w.cn !== correctWord.cn)
                .map(w => ({ word: w, score: distractorScore(correctWord, w) }));

            // 先按相似度分组，再在高分候选中随机取，既增加难度，也避免每次顺序完全固定。
            candidates.sort((a, b) => b.score - a.score || Math.random() - 0.5);
            const topPoolSize = Math.min(candidates.length, Math.max(12, count * 5));
            const topPool = shuffle(candidates.slice(0, topPoolSize));
            return topPool.slice(0, count).map(x => x.word.cn);
        }

        function generateOptions(correctWord, allWords) {
            const distractors = getDistractors(correctWord, allWords, 3);
            const opts = [correctWord.cn, ...distractors];
            while (opts.length < 4) opts.push('——');
            return shuffle(opts);
        }

        // ---------- 本地 Cookie 持久化 ----------
        const STORAGE_KEY = 'vocab_mcq_state_v2';
        function cookieSet(name, value, days = 365) {
            const encoded = encodeURIComponent(value);
            document.cookie = `${name}=${encoded}; max-age=${days * 86400}; path=/; SameSite=Lax`;
        }
        function cookieGet(name) {
            const prefix = name + '=';
            const found = document.cookie.split('; ').find(row => row.startsWith(prefix));
            return found ? decodeURIComponent(found.slice(prefix.length)) : null;
        }
        function encodeBits(bits) {
            const bytes = new Uint8Array(Math.ceil(bits.length / 8));
            bits.forEach((v, i) => { if (v) bytes[i >> 3] |= 1 << (i & 7); });
            let binary = '';
            bytes.forEach(b => binary += String.fromCharCode(b));
            return btoa(binary);
        }
        function decodeBits(str, length) {
            const bits = Array(length).fill(false);
            if (!str) return bits;
            try {
                const binary = atob(str);
                for (let i = 0; i < length; i++) {
                    const byte = binary.charCodeAt(i >> 3) || 0;
                    bits[i] = !!(byte & (1 << (i & 7)));
                }
            } catch (_) {}
            return bits;
        }
        function saveLocalState() {
            if (!state.words.length) return;
            const indexMap = new Map(state.words.map((w, i) => [w.en, i]));
            const correct = state.words.map(w => false);
            const wrong = state.words.map(w => false);
            state.questions.forEach(q => {
                const i = indexMap.get(q.en);
                if (i !== undefined) {
                    correct[i] = q.result === 'correct';
                    wrong[i] = q.result === 'wrong';
                }
            });
            const errorBits = state.words.map(w => state.errorWords.some(e => e.en === w.en));
            const payload = {
                v: 2, n: state.words.length,
                first: state.words[0].en, last: state.words[state.words.length - 1].en,
                c: encodeBits(correct), w: encodeBits(wrong), e: encodeBits(errorBits),
                mode: state.isReviewMode, idx: state.currentIndex
            };
            const value = JSON.stringify(payload);
            cookieSet(STORAGE_KEY, value);
            // file:// 页面上的部分浏览器不会持久化 cookie，localStorage 仅作为本地文件打开时的兼容兜底。
            try { localStorage.setItem(STORAGE_KEY, value); } catch (_) {}
        }
        function loadLocalState() {
            let raw = cookieGet(STORAGE_KEY);
            if (!raw) { try { raw = localStorage.getItem(STORAGE_KEY); } catch (_) {} }
            if (!raw) return null;
            try {
                const p = JSON.parse(raw);
                if (p.v !== 2 || p.n !== state.words.length || p.first !== state.words[0].en || p.last !== state.words[state.words.length - 1].en) return null;
                return p;
            } catch (_) { return null; }
        }

        function buildQuestions(wordList, allWords) {
            return wordList.map((w) => ({
                en: w.en,
                cn: w.cn,
                options: generateOptions(w, allWords),
                userAnswer: null,
                result: null,
            }));
        }

        // ================================================================
        //  核心函数
        // ================================================================
        function restoreLocalState() {
            const saved = loadLocalState();
            if (!saved) return false;
            const correct = decodeBits(saved.c, state.words.length);
            const wrong = decodeBits(saved.w, state.words.length);
            const errors = decodeBits(saved.e, state.words.length);
            state.errorWords = state.words.filter((_, i) => errors[i]);
            state.isReviewMode = !!saved.mode && state.errorWords.length > 0;
            let pool = state.isReviewMode ? shuffle([...state.errorWords]) : shuffle([...state.words]);
            state.questions = buildQuestions(pool, state.words);
            // 错题本进入“重新复习”状态时必须允许再次作答，而不是沿用上次的锁定状态。
            if (!state.isReviewMode) {
                const statusMap = new Map(state.words.map((w, i) => [w.en, i]));
                state.questions.forEach(q => {
                    const i = statusMap.get(q.en);
                    if (i !== undefined) {
                        if (correct[i]) q.result = 'correct';
                        else if (wrong[i]) q.result = 'wrong';
                    }
                });
            }
            state.currentIndex = Math.min(Number(saved.idx) || 0, Math.max(0, state.questions.length - 1));
            return true;
        }

        function initPractice() {
            if (!state.dataLoaded || state.words.length === 0) {
                renderEmptyState();
                return;
            }

            let pool = shuffle([...state.words]);

            if (state.isReviewMode && state.errorWords.length > 0) {
                pool = shuffle([...state.errorWords]);
                if (pool.length === 0) {
                    alert('错题本为空！');
                    state.isReviewMode = false;
                    pool = shuffle([...state.words]);
                }
            }

            if (pool.length === 0) {
                pool = shuffle([...state.words]);
            }

            state.questions = buildQuestions(pool, state.words);
            state.currentIndex = 0;

            renderAll();
        }

        function renderEmptyState() {
            document.getElementById('wordDisplay').textContent = '📂 请先导入单词数据';
            document.getElementById('wordDisplay').className = 'word-display empty';
            document.getElementById('optionsContainer').innerHTML = '';
            document.getElementById('qNumber').innerHTML = '第 0 题 <span class="total">/ <span id="totalQ">0</span></span>';
            document.getElementById('qStatus').textContent = '—';
            document.getElementById('qStatus').className = 'q-status';
            document.getElementById('wordCountLabel').innerHTML = '共 <span id="wordCountNum">0</span> 词';
            document.getElementById('progressTabs').innerHTML = '';
            document.getElementById('gridItems').innerHTML = '';
            document.getElementById('progressText').textContent = '0 / 0';
            document.getElementById('prevBtn').disabled = true;
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('doneCount').textContent = '0';
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('wrongCount').textContent = '0';
            document.getElementById('errorCount').textContent = '0';
        }

        // ================================================================
		//  加载数据
		// ================================================================
		function loadWordsData(data) {
			if (!Array.isArray(data) || data.length === 0) {
				alert('数据格式错误，请确保是 JSON 数组格式！');
				return;
			}

			if (!data.every(item => item.en && item.cn)) {
				alert('数据格式错误，每个条目需要包含 "en" 和 "cn" 字段！');
				return;
			}

			state.words = data;
			state.dataLoaded = true;
			state.errorWords = [];
			state.isReviewMode = false;

			document.getElementById('wordCountNum').textContent = data.length;
			// 删除下面这两行 —— 它们引用了不存在的元素
			// document.getElementById('fileStatus').textContent = `✅ 已加载 ${data.length} 个单词`;
			// document.getElementById('fileStatus').className = 'file-status loaded';

            if (!restoreLocalState()) initPractice();
            else renderAll();
        }

        // ================================================================
        //  渲染
        // ================================================================
        function renderAll() {
            renderStats();
            renderTabs();
            renderQuestion();
            renderGrid();
            renderProgressText();
            updateErrorBookUI();
        }

		function renderStats() {
			const total = state.questions ? state.questions.length : 0;
			let done = 0, correct = 0, wrong = 0;
			if (state.questions) {
				state.questions.forEach(q => {
					if (q.result === 'correct') { correct++; done++; }
					if (q.result === 'wrong') { wrong++; done++; }
				});
			}
			document.getElementById('doneCount').textContent = done;
			document.getElementById('correctCount').textContent = correct;
			document.getElementById('wrongCount').textContent = wrong;
			const totalQEl = document.getElementById('totalQ');
			if (totalQEl) totalQEl.textContent = total;
			// ✅ wordCountNum 已经在 loadWordsData 中设置过了，这里不需要重复设置
		}

        function renderTabs() {
            const container = document.getElementById('progressTabs');
            const total = state.questions ? state.questions.length : 0;
            if (total === 0) { container.innerHTML = ''; return; }

            const totalPages = Math.ceil(total / 100);
            let html = '';
            for (let i = 0; i < totalPages; i++) {
                const start = i * 100 + 1;
                const end = Math.min((i + 1) * 100, total);
                const active = state.currentIndex >= i * 100 && state.currentIndex < (i + 1) * 100 ? 'active' : '';
                const doneInRange = state.questions.slice(i * 100, (i + 1) * 100).filter(q => q.result !== null).length;
                html += `<span class="tab ${active}" data-page="${i}">${start}-${end} <span class="badge">${doneInRange}/${end - start + 1}</span></span>`;
            }
            container.innerHTML = html;

			container.querySelectorAll('.tab').forEach(el => {
				el.addEventListener('click', function(e) {
					const page = parseInt(e.currentTarget.dataset.page);
					const idx = page * 100;
					if (idx < state.questions.length) {
						state.currentIndex = idx;
						renderAll();
					}
				});
			});
        }

        function renderQuestion() {
            if (!state.questions || state.questions.length === 0) {
                renderEmptyState();
                return;
            }

            const q = state.questions[state.currentIndex];
            const idx = state.currentIndex;
            const total = state.questions.length;

            const wordEl = document.getElementById('wordDisplay');
            wordEl.textContent = q.en;
            wordEl.className = 'word-display';

            document.getElementById('qNumber').innerHTML =
                `第 ${idx + 1} 题 <span class="total">/ <span id="totalQ">${total}</span></span>`;

            const statusEl = document.getElementById('qStatus');
            if (state.isReviewMode && state.questions.every(item => item.result !== null)) {
                statusEl.textContent = '🎉 错题复习完成';
                statusEl.className = 'q-status answered';
            } else if (q.result === 'correct') {
                statusEl.textContent = '✅ 回答正确';
                statusEl.className = 'q-status answered';
            } else if (q.result === 'wrong') {
                statusEl.textContent = '❌ 回答错误';
                statusEl.className = 'q-status wrong-status';
            } else {
                statusEl.textContent = '未作答';
                statusEl.className = 'q-status';
            }

            const container = document.getElementById('optionsContainer');
            const labels = ['A', 'B', 'C', 'D'];
            let html = '';
            q.options.forEach((opt, i) => {
                let cls = 'option-item';
                if (q.result !== null) {
                    cls += ' disabled';
                    if (opt === q.cn) cls += ' correct';
                    if (q.userAnswer === opt && q.result === 'wrong') cls += ' wrong';
                    if (q.result === 'wrong' && opt === q.cn) cls += ' reveal-correct';
                }
                html += `
                        <div class="${cls}" data-opt="${opt}" data-index="${i}">
                            <span class="label">${labels[i]}</span>
                            <span class="text">${opt}</span>
                        </div>
                    `;
            });
            container.innerHTML = html;

            if (q.result === null) {
                container.querySelectorAll('.option-item').forEach(el => {
                    el.addEventListener('click', function() {
                        handleAnswer(this.dataset.opt);
                    });
                });
            }

            document.getElementById('prevBtn').disabled = (idx === 0);
            document.getElementById('nextBtn').disabled = (idx === total - 1);
        }

        function renderGrid() {
            const container = document.getElementById('gridItems');
            if (!state.questions || state.questions.length === 0) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            state.questions.forEach((q, i) => {
                let cls = 'grid-item';
                if (q.result === 'correct') cls += ' correct';
                else if (q.result === 'wrong') cls += ' wrong';
                if (i === state.currentIndex) cls += ' current';
                html += `<div class="${cls}" data-index="${i}">${i + 1}</div>`;
            });
            container.innerHTML = html;

			container.querySelectorAll('.grid-item').forEach(el => {
				el.addEventListener('click', function(e) {
					state.currentIndex = parseInt(e.currentTarget.dataset.index);
					renderAll();
                    saveLocalState();
				});
			});
        }

        function renderProgressText() {
            const total = state.questions ? state.questions.length : 0;
            document.getElementById('progressText').textContent =
                total > 0 ? `${state.currentIndex + 1} / ${total}` : '0 / 0';
        }

        function updateErrorBookUI() {
            const btn = document.getElementById('errorBookBtn');
            if (state.isReviewMode) {
                btn.innerHTML = '📕 全部题目 <span class="count" id="errorCount">✕</span>';
            } else {
                btn.innerHTML = `📕 错题本 <span class="count" id="errorCount">${state.errorWords.length}</span>`;
            }
        }

        // ================================================================
        //  答题逻辑
        // ================================================================
        let autoNextTimer = null;
        let toastTimer = null;
        function showAnswerToast(message, isWrong = false) {
            const toast = document.getElementById('answerToast');
            if (!toast) return;
            clearTimeout(toastTimer);
            toast.textContent = message;
            toast.className = 'answer-toast' + (isWrong ? ' wrong-toast' : '') + ' show';
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
        }

        function handleAnswer(selected) {
            const q = state.questions[state.currentIndex];
            if (q.result !== null) return;

            q.userAnswer = selected;
            if (selected === q.cn) {
                q.result = 'correct';
                // 错题复习时答对，自动从错题本移除。
                state.errorWords = state.errorWords.filter(w => w.en !== q.en);
                showAnswerToast('✅ 回答正确');
            } else {
                q.result = 'wrong';
                const wordObj = state.words.find(w => w.en === q.en);
                if (wordObj && !state.errorWords.some(w => w.en === q.en)) state.errorWords.push(wordObj);
                showAnswerToast('❌ 回答错误，正确答案已标出', true);
            }
            saveLocalState();
            renderAll();

            // 只有答对才自动进入下一题；答错后停留在当前题方便看答案。
            if (q.result === 'correct' && state.currentIndex < state.questions.length - 1) {
                clearTimeout(autoNextTimer);
                autoNextTimer = setTimeout(() => {
                    state.currentIndex++;
                    renderAll();
                    saveLocalState();
                }, 2000);
            }
        }

        // ================================================================
        //  导航
        // ================================================================
        function goToPrev() {
            if (state.currentIndex > 0 && state.questions.length > 0) {
                state.currentIndex--;
                renderAll();
                saveLocalState();
            }
        }

        function goToNext() {
            if (state.currentIndex < state.questions.length - 1 && state.questions.length > 0) {
                state.currentIndex++;
                renderAll();
                saveLocalState();
            }
        }

        // ================================================================
        //  重置
        // ================================================================
        function resetAll() {
            if (state.words.length === 0) {
                alert('请先导入单词数据！');
                return;
            }
            if (confirm('确定要重置所有进度吗？')) {
                state.errorWords = [];
                state.isReviewMode = false;
                state.questions = [];
                try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
                cookieSet(STORAGE_KEY, '', -1);
                initPractice();
                saveLocalState();
            }
        }

        // ================================================================
        //  错题本切换
        // ================================================================
        function toggleErrorBook() {
            if (!state.dataLoaded || state.words.length === 0) {
                alert('请先导入单词数据！');
                return;
            }
            state.isReviewMode = !state.isReviewMode;
            if (state.isReviewMode && state.errorWords.length === 0) {
                alert('错题本为空，请先做题积累错题！');
                state.isReviewMode = false;
                return;
            }
            initPractice();
            updateErrorBookUI();
            saveLocalState();
        }

        // ================================================================
        //  网格折叠
        // ================================================================
        function toggleGrid() {
            const container = document.getElementById('gridContainer');
            const btn = document.getElementById('gridToggle');
            container.classList.toggle('open');
            btn.textContent = container.classList.contains('open') ? '📊 收起网格' : '📊 展开网格';
        }

        // ================================================================
        //  键盘快捷键
        // ================================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') goToPrev();
            if (e.key === 'ArrowRight') goToNext();
        });

        window.addEventListener('beforeunload', saveLocalState);

        // ================================================================
        //  启动
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('prevBtn').addEventListener('click', goToPrev);
            document.getElementById('nextBtn').addEventListener('click', goToNext);
            document.getElementById('resetBtn').addEventListener('click', resetAll);
            document.getElementById('errorBookBtn').addEventListener('click', toggleErrorBook);
            document.getElementById('gridToggle').addEventListener('click', toggleGrid);

            // 直接加载内置数据
            loadWordsData(WORDS_DATA);
        });
    </script>

</body>
</html>
